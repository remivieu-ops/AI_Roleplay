    --line: #30333b;
    --line-soft: #23252b;
    --primary: #2f63e0;
    --link: #8db0ff;
    --tint: #1c2640;
    --rail-tile: #17301f;
    --rail-tile-fg: #7fd6a4;
    --circle: #23252b;
    --prompt-bg: #1b1c21;
    --var-bg: #4a3a0a;
    --var-fg: #ffe08a;
    --fill-bg: #1d3566;
    --fill-fg: #bcd5ff;
    --proto-bg: #3a3010;
    --proto-fg: #ffd978;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
    --a0: #1b2646; --b0: #26376b; --cb0: #22305a; --cf0: #a9c3ff;
    --a1: #2a1f3d; --b1: #43305f; --cb1: #35264d; --cf1: #d4b4f5;
    --a2: #19302a; --b2: #244a3b; --cb2: #1e3a2f; --cf2: #8fd9b0;

  }
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 60; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, dl { margin: 0; }
svg { display: block; flex: none; }
.g { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.internal { display: flex; align-items: center; justify-content: center; gap: 8px; background: #18191d; color: #fff; font-size: 13px; font-weight: 500; line-height: 1.35; text-align: center; padding: 8px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
.internal svg { flex: none; }
.lang { display: flex; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; height: 48px; }
.lang button { background: transparent; border: 0; padding: 0 16px; font-size: .95rem; font-weight: 500; color: var(--muted); min-width: 50px; }
.lang button + button { border-left: 1px solid var(--line); }

/*39*/["Das Briefing zur Ladenöffnung leiten","eine Abteilungsleitung","das Team-Briefing zur Öffnung in drei Minuten mit den Prioritäten des Tages leiten","Das Briefing muss kurz, motivierend und klar sein. Die Leitung muss die Botschaften priorisieren.","Eiliges Team, das mit praktischen Fragen unterbricht."],
/*40*/["Ein Nachschubproblem an die Zentrale melden","eine Filialleitung","der Zentrale einen Versorgungsengpass melden, der den Umsatz beeinträchtigt","Fehlbestände wiederholen sich. Die Leitung muss mit Fakten argumentieren und Maßnahmen erwirken.","Beschäftigte Supply-Chain-Leitung der Zentrale, die vor einer Reaktion Daten sehen will."],
/*41*/["Gespräch mit einem Berater unter Ziel","eine Filialdirektion","ein Gespräch mit einem Berater führen, der hinter seinen Vertriebszielen zurückliegt","Der Berater ist von seinen Ergebnissen demotiviert. Die Direktion muss die Ursachen analysieren und einen Aktionsplan erstellen.","Entmutigter Berater, der seine Ergebnisse mit dem Marktumfeld erklärt."],
/*42*/["Einen Berater bei der Akquise begleiten","eine Filialdirektion","einen Berater begleiten, der die Neukundenakquise meidet","Der Berater bevorzugt den Bestandskundenstamm. Die Direktion muss die Blockade verstehen und einen Rahmen vorschlagen.","Berater, der sich bei Bestandskunden wohlfühlt, aber bei der Kaltakquise unsicher ist."],
/*43*/["Neue, anspruchsvollere Ziele ankündigen","eine Filialdirektion","dem Team neue, anspruchsvollere Vertriebsziele ankündigen","Die Ziele steigen. Die Direktion muss den Kontext erklären, Bedenken anhören und motivierend bleiben.","Skeptischer Berater, der die Ziele für unrealistisch hält."],
/*44*/["Eine Kreditablehnung mitteilen","eine Kundenberaterin","einem Kunden eine Kreditablehnung mitteilen und die Beziehung erhalten","Der Antrag wird nicht bewilligt. Die Beraterin muss klar erklären, Optionen aufzeigen und menschlich bleiben.","Enttäuschter Kunde, der mit diesem Kredit gerechnet hat und die Entscheidung anficht."],
/*45*/["Kunde besorgt über fallende Anlagen","eine Kundenberaterin","einen Kunden beruhigen, der sich über den Wertverlust seiner Geldanlagen sorgt","Der Markt ist volatil. Die Beraterin muss erklären, ohne zu verharmlosen, und an die Strategie erinnern.","Ängstlicher Kunde, der sofort alles verkaufen will."],
/*46*/["Beschwerde über Bankgebühren","eine Kundenberaterin","die Beschwerde eines Kunden bearbeiten, der berechnete Bankgebühren anficht","Der Kunde fühlt sich schlecht informiert. Die Beraterin muss zuhören, erklären und eine Lösung vorschlagen.","Verärgerter Kunde, der mit einem Bankwechsel droht."],
/*47*/["Regulatorische Angaben eines zögerlichen Kunden einholen","eine Kundenberaterin","regulatorisch vorgeschriebene Angaben bei einem Kunden einholen, der sie ungern preisgibt","Der Kunde findet die Fragen aufdringlich. Die Beraterin muss die gesetzliche Pflicht erklären und beruhigen.","Verärgerter Kunde, der fragt, wozu die Bank diese Angaben braucht."],
/*48*/["Eine verdächtige Transaktion melden","ein Mitarbeiter","der eigenen Führungskraft eine verdächtige Transaktion melden und das weitere Vorgehen festlegen","Die Transaktion zeigt ungewöhnliche Signale. Der Mitarbeiter muss die Fakten darlegen, ohne zu beschuldigen, und das Verfahren einhalten.","Aufmerksame Führungskraft, die genaue Angaben verlangt, bevor sie die Compliance informiert."],
/*49*/["Eine Kreditvorlage im Ausschuss verteidigen","ein Firmenkundenbetreuer","eine Kreditvorlage vor dem Kreditausschuss präsentieren und verteidigen","Der Ausschuss hinterfragt die Annahmen. Der Betreuer muss mit Zahlen argumentieren und Einwände beantworten.","Anspruchsvolles Ausschussmitglied, das auf den Risiken beharrt."],
/*50*/["Einen Kundenbestand übergeben","eine Kundenberaterin","den eigenen Kundenbestand vor dem Weggang an eine Kollegin übergeben","Die Übergabe muss vollständig und reibungslos sein. Die Beraterin muss Kunden priorisieren und auf heikle Punkte hinweisen.","Eilige Kollegin, die zu jedem Kunden gezielt nachfragt."],
/*51*/["Weniger Stunden für einen internen Trainer ankündigen","eine Akademieleitung","einem internen Trainer ankündigen, dass seine Trainingsstunden reduziert werden","Die Akademie reduziert ihr Präsenzangebot. Die Leitung muss erklären und andere Aufgaben vorschlagen.","Trainer, der an der Moderation hängt und sich abgewertet fühlt."],
/*52*/["Einen neuen Trainer nach einer schwierigen Session begleiten","eine pädagogische Leitung","einen neuen Trainer nach einer misslungenen Session begleiten","Der Trainer zweifelt an sich. Die Leitung muss nachbesprechen, ohne zu entmutigen, und einen Entwicklungsplan erstellen.","Entmutigter neuer Trainer, der glaubt, nicht für den Beruf gemacht zu sein."],
/*53*/["In einem Streit zwischen zwei Konzeptern vermitteln","eine pädagogische Leitung","in einem Streit zwischen zwei Instructional Designern über den Ansatz eines Lernpfads entscheiden","Jeder verteidigt seine Vision. Die Leitung muss zuhören, auf das Lernziel zurückführen und entscheiden.","Instructional Designer, überzeugt von seiner Methode, der Kritik persönlich nimmt."],
/*54*/["Demotivierter Teilnehmer stört die Session","ein Trainer","mit einem demotivierten Teilnehmer umgehen, der die Schulung stört","Der Teilnehmer wurde von seiner Führungskraft geschickt. Der Trainer muss ihn zurückgewinnen, ohne die Gruppe zu verlieren.","Verschlossener Teilnehmer, der sagt, er habe um nichts gebeten und sehe keinen Sinn darin."],
/*55*/["Den Bedarf einer auftraggebenden Führungskraft klären","eine Betreuerin für Firmenkunden","den Bedarf einer Führungskraft erfassen, die eine Schulung will, ohne genau zu wissen wofür","Die Führungskraft will „etwas zur Kommunikation“. Die Betreuerin muss das eigentliche Problem herausarbeiten.","Auftraggebende Führungskraft, vage und eilig, die schnell eine Antwort will."],
/*56*/["Teilnehmer unzufrieden mit seiner Schulung","eine Weiterbildungsreferentin","auf einen Teilnehmer eingehen, der mit der gerade absolvierten Schulung unzufrieden ist","Der Teilnehmer findet die Schulung zu theoretisch. Die Referentin muss zuhören, verstehen und einen nächsten Schritt vorschlagen.","Enttäuschter Teilnehmer, der glaubt, seine Zeit verschwendet zu haben."],
/*57*/["An die Dokumentationspflichten erinnern","eine Qualitätsverantwortliche für Weiterbildung","einen Trainer an seine Dokumentationspflichten bei Anwesenheitslisten und Bewertungen erinnern","Vor einem Audit fehlen Unterlagen. Die Verantwortliche muss die Regeln bekräftigen und eine rasche Nachreichung erreichen.","Freiberuflicher Trainer, der diese Verwaltungspflichten übertrieben findet."],
/*58*/["Antrag auf Löschung personenbezogener Daten","eine Weiterbildungsreferentin","auf einen Teilnehmer reagieren, der die Löschung seiner personenbezogenen Daten verlangt","Die Referentin muss das Datenschutzverfahren anwenden und erklären, was gelöscht oder aufbewahrt werden kann.","Teilnehmer, der seine Rechte kennt und eine genaue Antwort mit Fristen verlangt."],
/*59*/["Das Weiterbildungsbudget vor der Geschäftsleitung verteidigen","eine Leitung der Weiterbildung","der Geschäftsleitung die Ergebnisse eines Schulungsprogramms vorstellen und dessen Budget verteidigen","Die Geschäftsleitung zweifelt am Return on Investment. Die Leitung muss Ergebnisse vorlegen und argumentieren.","Skeptischer Finanzvorstand, der nach Zahlen und Geschäftsauswirkungen fragt."],
/*60*/["Eine Führungskraft überzeugen, ihr Team freizustellen","eine Weiterbildungsreferentin","eine Führungskraft überzeugen, ihre Mitarbeitenden für eine Schulung freizustellen","Die Führungskraft verweist auf die Arbeitslast. Die Referentin muss den Nutzen belegen und einen Zeitplan vorschlagen.","Überlastete Führungskraft, die Weiterbildung für Zeitverschwendung hält."],
/*61*/["Den Einwand „Wir haben schon ein Tool“ entkräften","ein Key Account Manager","den Einwand eines Interessenten entkräften, der bereits ein Konkurrenzprodukt nutzt","Der Interessent hat einem ersten Gespräch zugestimmt, sieht aber keinen Grund zu wechseln. Der Key Account Manager muss die Grenzen des aktuellen Tools ausloten, ohne es schlechtzumachen, und einen Folgetermin vereinbaren.","Skeptischer, eiliger IT-Leiter, der an die Kosten eines Toolwechsels erinnert."],
/*62*/["Den Wert eines Vertrags gegen den Preis verteidigen","eine Versicherungsberaterin","den Wert eines Vertrags gegenüber einem Kunden verteidigen, der nur über den Preis eines Konkurrenzangebots spricht","Der Kunde hat ein günstigeres Angebot erhalten und erwägt zu wechseln. Die Beraterin muss Leistungen vergleichen, den Mehrwert herausstellen und eine realistische Anpassung vorschlagen.","Misstrauischer, preisfixierter Kunde, der bei jedem Argument das Konkurrenzangebot hervorholt."],
/*63*/["Einen skeptischen verordnenden Arzt überzeugen","ein Außendienstmitarbeiter","einen skeptischen verordnenden Arzt überzeugen, einen neuen Schnellbefund-Service zu nutzen","Der Arzt ist mit seinen Abläufen zufrieden und hat wenig Zeit. Der Außendienstmitarbeiter muss bei den Praxisabläufen ansetzen, den Nutzen für Patienten zeigen und einen Test vereinbaren.","Eiliger, skeptischer Hausarzt, der seinem Praxisteam keinen zusätzlichen Aufwand zumuten will."],
/*64*/["Eine Zusatzleistung ohne Druck anbieten","ein Verkäufer","einem Kunden, der gerade sein Produkt gewählt hat, eine Zusatzleistung wie Installation oder Garantieverlängerung anbieten","Der Kunde hat sich entschieden und will zur Kasse. Der Verkäufer muss die Leistung im richtigen Moment und passend zur Nutzung vorstellen und ein Nein akzeptieren.","Eiliger Kunde, misstrauisch gegenüber „Extras“, der glaubt, man wolle ihm etwas Unnötiges verkaufen."],
/*65*/["Einem Einkäufer eine Preiserhöhung ankündigen","ein Vertriebsingenieur","dem Einkäufer eines Großkunden eine Preiserhöhung von 6 % ankündigen","Die Erhöhung ist durch die Rohstoffkosten bedingt. Der Vertriebsingenieur muss sie klar ankündigen, begründen und Gegenleistungen verhandeln, ohne beim Wesentlichen nachzugeben.","Entschlossener Einkäufer eines Großkunden, der mit einer Ausschreibung droht."],
/*66*/["Ein KMU überzeugen, die Personalsuche auszulagern","ein Vertriebsmitarbeiter einer Personalagentur","den Inhaber eines KMU überzeugen, seine Zeitarbeitskräfte über die Agentur zu besetzen","Der Inhaber stellt aus Gewohnheit selbst ein und findet Zeitarbeit teuer. Der Vertriebsmitarbeiter muss seine Rekrutierungsprobleme verstehen und deren Kosten beziffern.","Misstrauischer KMU-Inhaber, der schlechte Erfahrungen gemacht hat und Agenturen zu teuer findet."],
/*67*/["Beim Check-in ein Upgrade anbieten","eine Rezeptionskraft","einem Gast beim Check-in ein Zimmer einer höheren Kategorie anbieten","Der Gast kommt müde nach einer langen Reise an. Die Rezeptionskraft muss ihn empfangen, die Gelegenheit erkennen und das Angebot ohne Drängen vorstellen.","Müder, wenig aufnahmebereiter Gast, der nur seinen Schlüssel will."],
/*68*/["Kunde droht mit Nichtverlängerung","ein Customer Success Manager","ein Gespräch mit einem Kunden führen, der wegen geringer Nutzung damit droht, sein Abonnement nicht zu verlängern","Der Kunde findet, dass seine Teams das Tool kaum nutzen. Der Customer Success Manager muss die Ursachen verstehen, den eigenen Anteil anerkennen und einen konkreten Adoptionsplan vorschlagen.","Enttäuschter Sponsor auf Kundenseite, der unter Druck seiner Geschäftsleitung die Ausgabe rechtfertigen muss."],
/*69*/["Einem durch einen Fehler blockierten Kunden schriftlich antworten","ein Supportmitarbeiter","einem Großkunden, der durch einen Softwarefehler blockiert ist, schriftlich antworten, ohne interne Informationen preiszugeben","Der Fehler ist bekannt und eine Korrektur ist in Arbeit. Der Supportmitarbeiter muss diagnostizieren, eine Übergangslösung anbieten und Transparenz schaffen, ohne interne Abstimmungen zu teilen.","Verärgerter Großkunde, der kurze Nachrichten schreibt und ein Datum für die Korrektur verlangt."],
/*70*/["Kunde beanstandet eine Preiserhöhung des Abos","ein Kundenberater","auf einen Kunden reagieren, der anruft, um die per E-Mail angekündigte Preiserhöhung seines Abonnements zu beanstanden","Der Kunde befürchtet versteckte Kosten und eine Unterbrechung des Dienstes. Der Berater muss die Erhöhung erklären, beruhigen und im Rahmen seiner Befugnisse einen passenden Tarif vorschlagen.","Zu Beginn des Gesprächs wütender Kunde, der sich beruhigt, wenn er sich gehört fühlt und eine klare Erklärung bekommt."],
/*71*/["Einen kündigungswilligen Kunden halten","ein Kundenbindungsberater","den Kündigungswunsch eines Kunden bearbeiten und versuchen, ihn ohne Druck zu halten","Der Kunde hat ein Konkurrenzangebot erhalten und ruft an, um zu kündigen. Der Berater muss den eigentlichen Grund verstehen, eine Alternative anbieten und die Entscheidung respektieren, wenn sie bestehen bleibt.","Entschlossener Kunde, höflich, aber bestimmt, der die Angebote bereits verglichen hat."],
/*72*/["Kunde verlangt eine vorgesetzte Person","ein Kundenberater","mit einem Kunden umgehen, der nach mehreren erfolglosen Anrufen eine vorgesetzte Person verlangt","Der Kunde hat bereits dreimal angerufen. Der Berater muss den Fall übernehmen, zeigen, dass er handeln kann, und nur bei Bedarf weiterverbinden.","Aufgebrachter Kunde, der immer wieder „Verbinden Sie mich mit Ihrem Vorgesetzten“ sagt und unterbricht."],
/*73*/["Eine treue Kundin kontaktieren","eine Verkaufsberaterin","eine treue Kundin anrufen, ihr eine neue Kollektion vorstellen und sie in die Boutique einladen","Die Kundin kauft regelmäßig, war aber seit Monaten nicht mehr da. Die Beraterin muss die Beziehung neu beleben, das Angebot personalisieren und einen Besuch vereinbaren.","Treue Kundin, höflich, aber wenig verfügbar, die sich nicht gern umworben fühlt."],
/*74*/["Beschädigtes Luxusprodukt","eine Verkaufsberaterin","eine Kundin empfangen, die ein nach wenigen Wochen beschädigtes Luxusprodukt zurückbringt","Die Kundin ist angesichts des Preises enttäuscht. Die Beraterin muss zuhören, sich der Sache annehmen und das Image des Hauses wahren, im Rahmen der Garantiebedingungen.","Enttäuschte Kundin, elegant und kühl, die eine dem Preis angemessene Behandlung erwartet."],
/*75*/["Reisender verärgert nach einer Annullierung","eine Servicekraft","einen verärgerten Reisenden betreuen, dessen Verbindung gerade annulliert wurde","Der Reisende droht einen wichtigen Termin zu verpassen. Die Servicekraft muss seinen Ärger auffangen, die Lage erklären und die verfügbaren Umbuchungen anbieten.","Wütender, eiliger Reisender, der dem Unternehmen Geringschätzung seiner Kunden vorwirft."],
/*76*/["Kollege umgeht eine Sicherheitsregel","eine Teamleitung","einen Mitarbeiter ansprechen, der eine Sicherheitsregel umgangen hat, um Zeit zu sparen","Der Mitarbeiter hat eine vorgeschriebene Prüfung ausgelassen, um den Fahrplan einzuhalten. Die Teamleitung muss die Regel bekräftigen, den empfundenen Druck verstehen und eine Zusage erhalten.","Erfahrener Mitarbeiter in der Defensive, der auf Verspätungen und Zeitdruck verweist."],
/*77*/["Ein strukturiertes Vorstellungsgespräch führen","eine Führungskraft","ein strukturiertes Vorstellungsgespräch mit einem Bewerber führen, der vage antwortet","Die Führungskraft muss verhaltensbezogene Fragen stellen, Beispiele vertiefen und den Bewerber nach festgelegten Kriterien bewerten, ohne sich von seiner Gewandtheit blenden zu lassen.","Redegewandter Bewerber, der in Allgemeinplätzen antwortet und konkreten Beispielen ausweicht."],
/*78*/["Ein Anhörungsgespräch vor einer Abmahnung führen","eine Personalleitung","ein Anhörungsgespräch vor einer disziplinarischen Maßnahme mit einem Mitarbeiter führen, der die Vorwürfe bestreitet","Die Personalleitung muss die Fakten neutral darlegen, die Erklärungen des Mitarbeiters anhören und das Verfahren einhalten, ohne im Gespräch eine Entscheidung zu verkünden.","Streitbarer Mitarbeiter in Begleitung, der die Vorwürfe bestreitet und seine Vorgesetzten verantwortlich macht."],
/*79*/["Eine Gehaltserhöhung ablehnen","eine Führungskraft","die Bitte eines guten Mitarbeiters um Gehaltserhöhung ablehnen, ohne ihn zu demotivieren","Das Budget lässt in diesem Jahr keine Erhöhung zu. Die Führungskraft muss die Absage mitteilen, den Beitrag würdigen und einen glaubwürdigen Entwicklungsplan aufbauen.","Leistungsstarker, enttäuschter Mitarbeiter, der andeutet, sich anderweitig umzusehen."],
/*80*/["Das vorzeitige Ende eines Einsatzes mitteilen","eine Personaldisponentin","einer Zeitarbeitskraft das vorzeitige Ende ihres Einsatzes bei einem Kundenunternehmen mitteilen","Das Kundenunternehmen fährt seine Aktivität zurück. Die Disponentin muss die Nachricht klar überbringen, die Modalitäten erklären und eine Perspektive anbieten.","Besorgte Zeitarbeitskraft, die mit diesem Einsatz gerechnet hat und Einkommensausfälle fürchtet."],
/*81*/["Das Angebot in zwei Minuten präsentieren","ein neuer Vertriebsmitarbeiter","das Angebot in zwei Minuten einem eiligen Interessenten präsentieren, der ihn unterbricht","Am Ende der Einarbeitung muss der neue Vertriebsmitarbeiter das Nutzenversprechen präsentieren, auf Unterbrechungen reagieren und einen Termin zur Bedarfsanalyse erhalten.","Eiliger Interessent, der unterbricht und fragt: „Was bringt mir das konkret?“"],
/*82*/["Einen wegen KI besorgten Mitarbeiter beruhigen","eine Führungskraft","einen Mitarbeiter beruhigen, der fürchtet, dass ein neues KI-Tool seinen Arbeitsplatz bedroht","Das Team wird einen KI-Assistenten einsetzen. Die Führungskraft muss die Sorgen anhören, erklären, was sich wirklich ändert, und den Mitarbeiter in die Einführung einbinden.","Erfahrener, besorgter Mitarbeiter, der glaubt, die KI werde ihn ersetzen."]

["Ich möchte mit dir über das sprechen, was du vorhin auf dem Flur gesagt hast, weil mich das etwas beschäftigt.","Wir waren an einem Ort, an dem andere mithören konnten. Ist dir das bewusst?","Wir sprechen über Patienten nur noch im Übergaberaum. Einverstanden?"],
["Ich übergebe dir das Wichtigste zu Zimmer 12: Schmerzen beobachten, Medikation um 18 Uhr umgestellt.","Drei Punkte für die Nacht: Vitalwerte alle zwei Stunden, Flüssigkeitszufuhr, bei Fieber den Arzt rufen.","Hast du Fragen? Kannst du mir die Punkte zur Beobachtung noch einmal wiederholen?"],
["Ich möchte mit dir die Versorgung von vorhin durchgehen. Wie hast du sie erlebt?","Ein Handgriff muss wiederholt werden: die Handhaltung. Ich zeige es dir, dann machst du es noch einmal vor mir.","Beim Rest hast du gute Fortschritte gemacht. Wiederholen wir den Handgriff morgen früh zusammen?"],
["Ich muss dir eine Änderung an deinem Arbeitsplatz ankündigen und erkläre sie dir lieber persönlich.","Ich weiß, dass du an diesem Platz hängst. Was beunruhigt dich an der Änderung?","Wir testen es zwei Wochen lang, mit einem Zwischenstand zur Halbzeit, um nachzujustieren."],
["Ich habe euch beide zusammengeholt, weil die Schichtübergaben ein Problem sind, und ich möchte, dass wir gemeinsam eine Lösung finden.","Sagt mir beide, was am Ende eurer Schicht offen bleibt, mit konkreten Beispielen.","Wir legen eine gemeinsame Checkliste für das Schichtende fest, die ihr beide bis Freitag freigebt."],
["Ich möchte über den Qualitätsvorfall vom Montag sprechen, nicht um einen Schuldigen zu finden, sondern um daraus zu lernen.","Was hat eurer Meinung nach zu diesem Fehler geführt?","Das ändern wir ab morgen, und danke dafür, wie ihr die Nacharbeit gemeistert habt."],
["Danke für Ihre Meldung. Wir bestätigen, dass die Charge nicht konform ist.","Unser Plan: Ursachenanalyse innerhalb von 48 Stunden und Ersatz der Charge innerhalb von fünf Tagen.","Ich rufe Sie am Donnerstag mit dem Analysebericht an. Passt Ihnen das?"],
["Ich verstehe die Dringlichkeit: Ihre Maschine steht, und jede Stunde zählt.","Damit wir schnell eingreifen können: Was ist passiert, und welche Fehlermeldung wird angezeigt?","Ein Techniker ist morgen um 8 Uhr bei Ihnen, und ich informiere Sie über seine Ankunft."],
["Ich melde mich, um Sie vor einem Lieferverzug zu warnen, bevor er Sie trifft.","Bis wann brauchen Sie die Ware, damit Ihre Produktion nicht stillsteht?","Ich schlage eine Teillieferung am Dienstag und den Rest am Donnerstag vor, mit täglicher Rückmeldung."],
["Ich sehe, dass du ohne Schutzausrüstung arbeitest. Darüber muss ich jetzt sofort mit dir sprechen.","Was stört dich an der Ausrüstung?","Ich verstehe, wir prüfen eine Alternative, aber bis dahin trägst du sie. Darüber gibt es keine Diskussion."],
["Ich möchte mit dir noch einmal durchgehen, was vorhin passiert ist, damit es niemand anderem passiert.","Erzähl mir die Situation von Anfang an, so wie du sie erlebt hast.","Was ändern wir, damit das nicht wieder vorkommt? Ich notiere deine Vorschläge."],
["Die wichtigsten Punkte zum Schichtende: Linie 2 läuft mit reduziertem Takt, und Maschine B muss beobachtet werden.","Einziger dringender Punkt: die Einstellung jede Stunde prüfen. Bei der Sicherheit nichts Besonderes.","Kannst du mir die zwei Punkte, auf die du achten musst, noch einmal sagen?"],
["Danke, dass du mich empfängst. Ich bringe dir Zahlen zu einer Störung, die jede Woche wiederkommt.","Sie kostet uns etwa zwei Stunden Produktion pro Woche, also [x] Teile.","Kannst du sie diese Woche einplanen? Ich bringe dir die Aufzeichnungen."],
["Ich möchte mit dir darüber sprechen, wie du Kunden begrüßt, weil ich Rückmeldungen bekommen habe.","Hier zwei konkrete Beispiele, die ich beobachtet habe. Wie siehst du sie?","Wir setzen ein einfaches Ziel: jeden Kunden innerhalb von zehn Sekunden begrüßen. Am Freitag schauen wir, wie es läuft."],
["Ich habe euch zusammengerufen, um die Arbeitszeiten während des Schlussverkaufs vorzustellen, und erkläre euch die Gründe.","Wer hat besondere Einschränkungen? Sagt es mir heute, damit ich sie berücksichtigen kann.","Ich kann nicht alle Wünsche erfüllen, aber das kann ich anpassen."],
["Ich sehe, dass du zögerst, Kunden anzusprechen. Was hält dich zurück?","Lass es uns zusammen ausprobieren: Ich spiele den Kunden, und du sprichst mich mit einem einfachen Satz an.","Dein Ziel für heute: drei Kunden ansprechen. Um 16 Uhr ziehen wir Bilanz."],
["Ich verstehe, dass Sie eine Erstattung möchten, und danke Ihnen für Ihre Treue.","Die Erstattungsfrist ist abgelaufen, daher kann ich nicht erstatten, aber ich kann Ihnen eine Gutschrift anbieten.","Möchten Sie lieber die Gutschrift oder einen Umtausch gegen einen anderen Artikel?"],
["Was ist Ihnen bei diesem Produkt am wichtigsten: der Preis, die Haltbarkeit oder die Größe?","Wenn ich Sie richtig verstehe, möchten Sie etwas Einfaches und Robustes. Ich zeige Ihnen zwei Modelle.","Dieses hier erfüllt Ihre Kriterien. Soll ich es Ihnen als Geschenk verpacken?"],
["Ich verstehe, dass das ärgerlich ist, und entschuldige mich für die Wartezeit.","Ich öffne sofort eine Kasse. Kommen Sie hier entlang, ich kümmere mich um Sie.","Danke für Ihre Geduld. Einen schönen Tag noch."],
["Guten Tag, kann ich Ihnen helfen? Ich wollte nur sicherstellen, dass alles in Ordnung ist.","Wenn Sie möchten, begleite ich Sie mit den Artikeln in Ihrer Hand zur Kasse.","Danke. Ich informiere nur meine Vorgesetzte, wie es das Verfahren vorsieht."],
["Ich möchte mit dir über die Kassendifferenz dieser Woche sprechen, ohne dir etwas vorzuwerfen.","Kannst du mir beschreiben, wie dein Kassenabschluss abläuft?","Wir gehen das Verfahren heute Abend zusammen durch, und bis Freitag zähle ich die Kasse mit dir."],
["Guten Morgen zusammen, drei Prioritäten heute: die Aktion, der Bestand in Gang A und die Kasse.","Wer hat blockierende Punkte? Ich nehme mir zwei Minuten dafür.","Um 12 Uhr treffen wir uns kurz wieder. Einen guten Tag euch!"],
["Ich melde mich wegen eines Versorgungsengpasses, der sich seit drei Wochen wiederholt.","Das kostet uns bei diesem Produkt etwa [x] Verkäufe pro Woche.","Können Sie mir sagen, wer die Situation lösen kann und in welcher Frist?"],
["Ich möchte mit dir die Ergebnisse des Quartals durchgehen und verstehen, wie du die Situation erlebst.","Was erklärt aus deiner Sicht den Abstand zum Ziel?","Wir machen es so: zwei Termine mit Interessenten pro Woche und jeden Freitag ein kurzes Gespräch."],
["Mir ist aufgefallen, dass du lieber mit Bestandskunden arbeitest. Was hält dich bei der Akquise zurück?","Wie wäre es, wenn wir einen Akquiseanruf zusammen im Rollenspiel üben?","Dein Ziel für die Woche: fünf Anrufe, und am Freitag besprechen wir sie gemeinsam."],
["Ich stelle euch die Ziele für das nächste Jahr vor und erkläre den Kontext.","Ich verstehe, dass das ehrgeizig wirkt. Was erscheint euch am schwierigsten?","Wir passen den Aktionsplan gemeinsam an, und ich bringe eure Anmerkungen nächste Woche in den Ausschuss."],
["Ich muss Ihnen mitteilen, dass die Bank diesen Kredit vorerst nicht gewähren kann, und möchte Ihnen erklären, warum.","Ich verstehe Ihre Enttäuschung. Schauen wir, was wir anders machen können.","Ich schlage vor, den Antrag in drei Monaten mit mehr Eigenkapital erneut zu prüfen. Passt Ihnen das?"],
["Ich verstehe Ihre Sorge wegen dieses Rückgangs und spreche lieber gleich mit Ihnen darüber.","Erinnern wir uns an Ihren Anlagehorizont: Sie haben für zehn Jahre investiert, und solche Schwankungen sind normal.","Ich schlage vor, die aktuelle Strategie beizubehalten und sie jedes Quartal zu überprüfen."],
["Ich verstehe, dass Sie diese Gebühren überraschen. Ich prüfe Ihre Unterlagen.","Daher kommen diese Gebühren, und so können Sie sie künftig vermeiden.","Ich erstatte die letzte Belastung aus Kulanz und bestätige Ihnen das schriftlich."],
["Ich benötige einige Angaben, um Ihre Unterlagen zu aktualisieren, wie es das Gesetz allen Banken vorschreibt.","Ich verstehe, dass das aufdringlich wirken kann. Diese Daten bleiben vertraulich.","Können Sie mir diese drei Unterlagen bis Freitag bringen? Ich schicke Ihnen die Liste schriftlich."],
["Ich möchte mit dir über eine Transaktion sprechen, die mir auf dem Konto dieses Kunden ungewöhnlich erscheint.","Das habe ich bemerkt: den Betrag, die Häufigkeit und den Empfänger.","Laut Verfahren melde ich sie heute an die Compliance. Bist du einverstanden?"],
["Ich stelle die Vorlage für Unternehmen X vor: eine Anfrage über [x] Euro zur Finanzierung einer Expansion.","Die identifizierten Risiken sind die Verschuldung und die Abhängigkeit von einem Kunden, aber das sind die angebotenen Sicherheiten.","Ich empfehle die Genehmigung mit zwei aufschiebenden Bedingungen. Ich beantworte gern Ihre Fragen."],
["Ich übergebe dir meinen Kundenbestand vor meinem Weggang. Diese fünf Kunden haben Vorrang.","Bei diesem Kunden aufpassen: Er wird lieber morgens kontaktiert und hat eine offene Anfrage.","Alle Details stehen in der Akte. Willst du zehn Minuten die heiklen Fälle mit mir durchgehen?"],
["Ich möchte dich direkt über eine Änderung in der Akademie informieren, die deine Trainingsstunden betrifft.","Ich weiß, dass dir das Trainieren viel bedeutet. Wie nimmst du diese Nachricht auf?","Ich schlage dir vor, die Begleitung neuer Trainer zu übernehmen, und wir sprechen in zwei Wochen wieder."],
["Ich möchte mir nach deiner Session einen Moment mit dir nehmen. Wie hast du sie erlebt?","Was lief aus deiner Sicht gut, und was würdest du anders machen?","Nächste Woche hospitieren wir zusammen bei einer Kollegin, und du sagst mir, was du mitnimmst."],
["Ich habe euch zusammengeholt, um eure beiden Ansätze für diesen Lernpfad zu klären.","Stellt beide in zwei Minuten vor, welches Lernergebnis ihr für die Lernenden anstrebt.","Wir testen beide Versionen mit einer kleinen Gruppe und entscheiden nach den Ergebnissen."],
["Ich sehe, dass es für Sie nicht einfach ist, hier zu sein. Was würde Ihnen helfen?","Was möchten Sie aus diesem Tag für Ihre Arbeit mitnehmen?","Ich schlage vor, von einem konkreten Fall aus Ihrem Alltag auszugehen, damit diese Session nützlich wird."],
["Um Ihren Bedarf genau zu verstehen: Welche Situation hat Sie zu dieser Schulungsanfrage veranlasst?","Was soll sich in drei Monaten konkret in Ihren Teams verändert haben?","Wenn ich zusammenfasse, ist das Ziel [x]. Ich schicke Ihnen innerhalb von zwei Tagen ein Angebot."],
["Danke, dass Sie mir Ihre Meinung sagen, das ist sehr hilfreich.","Was war Ihnen zu theoretisch, und woran hätten Sie gern gearbeitet?","Ich schlage Ihnen nächsten Monat einen zweistündigen Praxisworkshop vor und melde Sie bevorzugt an."],
["Ich möchte Sie an die Unterlagen erinnern, die vor dem Audit fehlen: Anwesenheitslisten und Bewertungen.","Was macht diese Verwaltungsaufgabe für Sie kompliziert?","Können Sie mir die fehlenden Unterlagen bis Donnerstag schicken? Ich biete Ihnen eine einfachere Vorlage an."],
["Ich bestätige den Eingang Ihres Antrags auf Löschung Ihrer personenbezogenen Daten.","Das löschen wir, und das müssen wir gesetzlich aufbewahren, und zwar so lange.","Sie erhalten innerhalb eines Monats eine schriftliche Bestätigung."],
["Ich stelle die Ergebnisse des Programms vor: [x] % Abschlussquote und [y] % weniger Fehler.","Der Return on Investment beruht auf drei Punkten: Produktivität, Mitarbeiterbindung und Compliance.","Ich beantrage ein Budget von [x], um das Programm auf zwei weitere Abteilungen auszuweiten."],
["Ich weiß, dass Sie viel zu tun haben, und ich nehme Ihre Zeit nicht ohne Grund in Anspruch.","Mit dieser Schulung sparen Ihre Teams danach etwa [x] Stunden pro Woche.","Ich schlage zwei halbe Tage außerhalb der Spitzenzeit vor. Welche Termine passen Ihnen?"],
["Danke für diese paar Minuten. Ich möchte nicht, dass Sie alles umstellen, sondern verstehen, wie Sie heute arbeiten.","Was kostet Ihre Teams mit dem aktuellen Tool noch zu viel Zeit?","Ich schlage einen 45-minütigen Workshop mit Ihren Teams vor, um an einem echten Fall zu vergleichen. Dienstag oder Donnerstag?"],
["Ich verstehe, dass der Preis zählt, und möchte, dass wir beide Angebote bei gleichen Leistungen vergleichen.","Wenn morgen ein Schaden eintritt, was wäre Ihnen dann am wichtigsten?","Ich kann die Selbstbeteiligung anpassen, um den Beitrag zu senken, und die wesentlichen Leistungen behalten. Schauen wir es uns gemeinsam an?"],
["Frau Doktor, ich weiß, dass Ihre Zeit knapp ist, ich fasse mich kurz.","Wie lange warten Sie heute auf einen dringenden Befund, und was bedeutet das für Ihre Patienten?","Ich schlage einen einmonatigen Test vor, ohne zusätzlichen Aufwand für Ihr Praxisteam. Ziehen wir am Ende gemeinsam Bilanz?"],
["Gute Wahl, das ist das Modell, das ich für Ihre beschriebene Nutzung empfehle.","Möchten Sie es selbst installieren, oder soll es direkt einsatzbereit sein?","Hier ist das Infoblatt zur Leistung: Wenn Sie es sich anders überlegen, können Sie sie innerhalb von 30 Tagen hinzubuchen."],
["Ich sage es Ihnen lieber persönlich: Unsere Preise steigen zum 1. Januar um 6 %.","Die Erhöhung spiegelt unsere Rohstoffkosten wider, ich zeige Ihnen gern die Aufschlüsselung. Was bereitet Ihnen die größten Schwierigkeiten?","Ich kann die Erhöhung auf zwei Quartale verteilen, wenn Sie sich auf die Jahresmengen festlegen. Ist das eine Gesprächsgrundlage?"],
["Ich bin nicht hier, um Ihnen um jeden Preis Zeitarbeit zu verkaufen, sondern um Ihren Personalbedarf zu verstehen.","Wie lange haben Sie bei Ihrer letzten Auftragsspitze gebraucht, um Verstärkung zu finden?","Ich schlage eine erste Stelle zum Test vor, mit einer Zufriedenheitsabfrage nach einer Woche."],
["Herzlich willkommen, und danke für Ihre Geduld nach dieser langen Reise.","Sind Sie beruflich hier oder um sich ein paar Tage zu erholen?","Ich habe heute Abend ein Zimmer mit Terrasse für einen kleinen Aufpreis frei. Sonst hier Ihr Schlüssel, einen schönen Abend."],
["Danke, dass Sie offen mit mir sprechen, genau das bringt uns weiter.","Was bremst Ihre Teams aus Ihrer Sicht im Alltag?","Ich schlage einen 60-Tage-Plan vor, mit zwei Workshops und einem monatlichen Blick auf Ihre Kennzahlen. Stimmen wir ihn am Freitag gemeinsam ab?"],
["Guten Tag, danke für Ihre Nachricht und die Screenshots, sie helfen mir, das Problem nachzustellen.","Zur Bestätigung der Diagnose: Tritt der Fehler bei allen Nutzern auf oder nur bei bestimmten Profilen?","Das Problem ist identifiziert und eine Korrektur ist in Arbeit. Bis dahin hier eine Übergangslösung, und am Donnerstag melde ich mich mit einem Zwischenstand."],
["Ich verstehe Ihre Überraschung über diese Nachricht und erkläre Ihnen alles.","Damit ich Ihnen den passenden Tarif vorschlagen kann: Wie nutzen Sie Ihr Abonnement im Alltag?","Ich schlage Ihnen diesen Tarif vor, der Ihre Dienste zu einem ähnlichen Preis wie bisher erhält. Ich schicke Ihnen die Zusammenfassung per E-Mail."],
["Ich nehme Ihren Wunsch auf. Bevor ich ihn bearbeite, darf ich fragen, was Sie zu diesem Schritt bewegt?","Wenn ich Sie richtig verstehe, ist es vor allem der Preis der kommenden Monate?","Ich kann Ihnen dieses Angebot für 12 Monate machen. Wenn Sie trotzdem kündigen möchten, leite ich das sofort ein."],
["Ich sehe, dass das Ihr dritter Anruf ist, und verstehe, dass Sie genug haben.","Ich übernehme Ihren Fall: Lassen Sie mich prüfen, woran es bisher gehakt hat.","Das mache ich jetzt, und ich rufe Sie morgen vor 12 Uhr persönlich zurück. Ist es dann nicht gelöst, gebe ich es an meine Vorgesetzte weiter."],
["Guten Tag, ich rufe Sie an, weil ich beim Entdecken der neuen Kollektion an Sie gedacht habe.","Beim letzten Mal suchten Sie ein Stück für den Abend. Ist das noch aktuell?","Ich kann Ihnen zwei Modelle in Ihrer Größe zurücklegen. Hätten Sie am Samstagvormittag Zeit?"],
["Das tut mir aufrichtig leid, das ist nicht das Erlebnis, das wir Ihnen bieten möchten.","Können Sie mir zeigen, was passiert ist, und seit wann Sie es bemerkt haben?","Ich gebe das Stück in unser Atelier und rufe Sie persönlich an, sobald es zurück ist, innerhalb von zehn Tagen."],
["Ich verstehe Ihren Ärger und tue alles, um schnell eine Lösung zu finden.","Wann müssen Sie wo ankommen?","Ich reserviere Ihnen einen Platz für die Abfahrt um 14:10 Uhr, und hier ist ein Essensgutschein für die Wartezeit."],
["Ich muss mit dir über die heute Morgen ausgelassene Prüfung sprechen, weil es um Sicherheit geht.","Was hat dich dazu gebracht, sie auszulassen: der Fahrplan, die Arbeitslast, etwas anderes?","Die Regel bleibt. Wenn der Fahrplan nicht haltbar ist, sagst du es mir, und ich gebe es weiter. Einverstanden?"],
["Danke, dass Sie gekommen sind. Wir sprechen über Ihre konkreten Erfahrungen, und am Ende haben Sie Zeit für Ihre Fragen.","Schildern Sie mir eine konkrete Situation, in der ein Kunde unzufrieden war: Was haben Sie persönlich getan?","Danke. Wir melden uns innerhalb einer Woche nach den anderen Gesprächen bei Ihnen."],
["Dieses Gespräch dient dazu, Ihnen die Ihnen vorgeworfenen Fakten darzulegen und Ihre Erklärungen anzuhören.","Das wurde am 12. festgestellt. Wie sehen Sie das?","Ich habe Ihre Erklärungen notiert. Heute wird keine Entscheidung getroffen: Sie erhalten fristgerecht eine schriftliche Antwort."],
["Ich möchte offen zu dir sein: Ich kann dir dieses Jahr keine Gehaltserhöhung geben.","Dein Beitrag zählt. Was ist dir in den nächsten zwei Jahren am wichtigsten?","Ich schlage dir einen Plan mit zwei Zielen und einer Überprüfung im Juni vor. Ich setze mich für dich ein."],
["Ich habe eine schwierige Nachricht für dich und sage sie dir lieber direkt.","Ich weiß, dass du mit diesem Einsatz gerechnet hast. Was beunruhigt dich am meisten?","Dein Einsatz endet am Freitag. Ich habe ab Montag zwei Stellen für dich, schauen wir sie uns zusammen an?"],
["Ich brauche zwei Minuten und sage Ihnen konkret, was sich für Sie ändert.","In einem Satz: Wir helfen Unternehmen wie Ihrem, ihre [x]-Kosten um [y] % zu senken. Was ist heute Ihre größte Herausforderung?","Ich schlage Ihnen am Donnerstag 30 Minuten vor, um Ihnen einen ähnlichen Fall zu zeigen."],
["Ich weiß, dass die Ankündigung dieses Tools Fragen aufwirft, und ich möchte offen mit dir darüber sprechen.","Was beunruhigt dich ganz konkret am meisten?","Das Tool übernimmt wiederkehrende Aufgaben, deine Expertise bleibt zentral. Ich schlage dir vor, Teil der Pilotgruppe zu sein."]

    copy: "Copy prompt", copied: "Copied", failed: "Text selected, press Ctrl/Cmd+C", ph: "[company]", title: "AI Roleplay use cases"
  },
  de: {

    hero: "82 Anwendungsfälle zum Üben mit einem Avatar, mündlich oder schriftlich. Kundenunternehmen oben eingeben, einen Fall öffnen, die Schlüsselsätze lesen und den Prompt in AI Roleplay kopieren.",
    all: "Alle", allBack: "Alle Branchen", seeAll: "Alle anzeigen", cases: "Fälle", sector: "Branche", useCases: "Anwendungsfälle",
    empty: "Kein Fall entspricht der Auswahl. Branche wechseln oder Suche löschen.",
    drawer: "Falldetails", oral: "Mündlich", written: "Schriftlich", close: "Schließen", avatar: "Avatar", role: "Rolle der lernenden Person", goal: "Ziel", skill: "Kompetenz",
    promptH: "Prompt für AI Roleplay",
    promptP: "Die Felder von AI Roleplay werden aus diesem Satz befüllt. Der Name des Kundenunternehmens (Feld oben auf der Seite) wird eingefügt, um die Szene in Kontext zu setzen.",
    phrasesH: "Vorgeschlagene Schlüsselsätze", phrasesP: "In der Reihenfolge der Szene. Sie spielen die lernende Person, der Avatar antwortet.",
    labels: ["Eröffnen", "Erkunden", "Abschließen"],
    copy: "Prompt kopieren", copied: "Kopiert", failed: "Text markiert, Strg/Cmd+C drücken", ph: "[Unternehmen]", title: "AI Roleplay Anwendungsfälle"
  }
};
var lang = "fr";
try { var sl = localStorage.getItem("rp-cas-usage-lang"); if (sl === "en" || sl === "fr" || sl === "de") lang = sl; } catch (err) {}
function U(k) { return UI[lang][k]; }
function dInd(x) { return lang === "en" ? SECT_EN[x] : lang === "de" ? SECT_DE[x] : x; }
function dType(x) { return lang === "en" ? TYPE_EN[x] : lang === "de" ? TYPE_DE[x] : x; }
function capFirst(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
function famOf(type) { for (var k = 0; k < FAMILIES.length; k++) if (FAMILIES[k].t.indexOf(type) !== -1) return FAMILIES[k].n; return ""; }
var EXAMPLES = [];
function buildExamples() {
  EXAMPLES = ROWS.map(function (r, i) {
    var w = WRITTEN.indexOf(i + 1) !== -1;
    /* t = [titre, apprenant, situation, scénario, avatar] dans la langue affichée */
    var t = lang === "en" ? ROWS_EN[i] : lang === "de" ? ROWS_DE[i] : [r[2], r[3], r[4], r[5], r[6]];
    var learner = t[1], situ = t[2], prompt;
    if (lang === "en") prompt = (w ? STEM_EN_W : STEM_EN) + learner + " at {entreprise} must " + situ + ".";
    else if (lang === "de") prompt = (w ? STEM_DE_W : STEM_DE) + learner + " bei {entreprise}. Aufgabe: " + situ + ".";
    else prompt = (w ? STEM_W : STEM) + learner + " de {entreprise} doit " + situ + ".";
    return {
      id: i + 1, ind: UNIV[r[0]], sub: SECT[r[0]], type: r[1], fam: famOf(r[1]),
      lvl: (lang === "en" ? LEVEL_EN : lang === "de" ? LEVEL_DE : LEVEL)[LEVELS[i]], lvlN: LEVELS[i], written: w,
      title: t[0],
      role: capFirst(learner.replace(/^(un|une|a|an|ein|eine) /, "")),
      goal: capFirst(situ),
      scenario: t[3], avatar: t[4],
      skill: (lang === "en" ? SKILLS_EN : lang === "de" ? SKILLS_DE : SKILLS)[r[1]],
      prompt: prompt,
      phrases: lang === "en" ? PHRASES_EN[i] : lang === "de" ? PHRASES_DE[i] : PHRASES[i]
    };
  });
}
buildExamples();


var INDUSTRIES = ["Services", "Tech & centres de contact", "Santé", "Industrie & transport", "Commerce & hôtellerie", "Banque & assurance", "Formation"];
var TYPES = FAMILIES.map(function (f) { return f.n; });
var state = { ind: "Tous", type: "Tous", q: "", entreprise: "", open: 0 };
var lastFocus = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function byId(id) { return EXAMPLES.filter(function (e) { return e.id === id; })[0]; }
function tIdx(e) { return TYPES.indexOf(e.fam); }

function plainPrompt(tpl) { return tpl.replace(/\{entreprise\}/g, state.entreprise.trim() || U("ph")); }
function htmlPrompt(tpl) {
  return esc(tpl).replace(/\{entreprise\}/g, function () {
    var v = state.entreprise.trim();
    return v ? '<span class="f">' + esc(v) + "</span>" : '<span class="v">' + esc(U("ph")) + "</span>";
  });
}

function matches(e) {
  if (state.ind !== "Tous" && e.ind !== state.ind) return false;
  if (state.type !== "Tous" && e.fam !== state.type) return false;
  var q = state.q.trim().toLowerCase();
  if (q) {
    var hay = (e.title + " " + e.scenario + " " + e.avatar + " " + dInd(e.ind) + " " + dInd(e.sub) + " " + dType(e.type) + " " + e.lvl + " " + (e.written ? U("written") : U("oral")) + " " + e.phrases.join(" ")).toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}

var QUOTE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>';

function renderFilters() {
  var pills = ["Tous"].concat(INDUSTRIES).map(function (n) {
    return '<button type="button" class="pill" data-ind="' + esc(n) + '" aria-pressed="' + (state.ind === n) + '">' + (n === "Tous" ? esc(U("all")) : esc(dInd(n))) + "</button>";
  }).join("");
  $("pills").innerHTML = pills;
  $("tiles").innerHTML = TYPES.map(function (n, i) {
    var c = EXAMPLES.filter(function (e) { return e.fam === n; }).length;
    return '<button type="button" class="tile" data-piece data-type="' + esc(n) + '" aria-pressed="' + (state.type === n) + '"><span class="lab"><b>' + esc(dType(n)) + "</b><small>" + c + " " + U("cases") + "</small></span></button>";
  }).join("");
}

function cardHtml(e) {
  var short = e.avatar.split(/[,.]/)[0];
  var n = tIdx(e);
  return '<button type="button" class="card t' + n + '" data-id="' + e.id + '">' +
    '<span class="card-top" style="background-size:' + (200 + (e.id * 37) % 140) + '%;background-position:' + ((e.id * 53) % 101) + '% ' + ((e.id * 29) % 101) + '%"></span>' +
    '<span class="card-body"><h3>' + esc(e.title) + '</h3><span class="chips"><span class="chip lv lv' + e.lvlN + '">' + esc(e.lvl) + '</span>' + (e.written ? '<span class="chip">' + esc(U("written")) + '</span>' : "") + '<span class="chip tc">' + esc(dType(e.type)) + "</span></span></span>" +
    '<span class="card-foot"><span class="av">' + esc(short.charAt(0).toUpperCase()) + '</span><span class="av-name">' + esc(short) + '</span><span class="q">' + QUOTE + "3</span></span>" +
    "</button>";
}

function renderSections() {
  var list = EXAMPLES.filter(matches);
  if (!list.length) { $("sections").innerHTML = '<div class="empty">' + esc(U("empty")) + "</div>"; return; }
  var wide = state.ind === "Tous";
  $("sections").innerHTML = INDUSTRIES.map(function (ind) {
    var items = list.filter(function (e) { return e.ind === ind; });
    if (!items.length) return "";
    return '<section><div class="sec-head"><h2>' + esc(dInd(ind)) + '</h2><span class="count">' + items.length + "</span>" +
      '<button type="button" class="seeall" data-see="' + (wide ? esc(ind) : "Tous") + '">' + (wide ? U("seeAll") : U("allBack")) + "</button></div>" +
      '<div class="' + (wide ? "row-scroll" : "row-grid") + '">' + items.map(cardHtml).join("") + "</div></section>";
  }).join("");
}

function layoutMosaic() {
  var heroBox = document.querySelector(".hero"), bg = $("hero-bg"), tiles = $("tiles");
  if (!heroBox || !bg || !tiles) return;
  var narrow = heroBox.getBoundingClientRect().width < 1280;
  heroBox.classList.toggle("narrow", narrow);
  var hr = bg.getBoundingClientRect(), W = hr.width, H = hr.height;
  var phone = window.innerWidth <= 520;
  var sc = Math.max(W / 2000, H / 1050);
  if (phone) sc = Math.max(sc, 1.5 * W / 2000);
  var iw = 2000 * sc, ih = 1050 * sc;
  var logoH = 0.17 * ih;
  var cy = (narrow && !phone) ? H - logoH / 2 - 28 : H / 2;
  var top = Math.min(0, Math.max(H - ih, cy - 0.495 * ih));
  bg.style.backgroundSize = iw + "px " + ih + "px";
  bg.style.backgroundPosition = ((W - iw) / 2) + "px " + top + "px";
  var tr = tiles.getBoundingClientRect(), Wt = tr.width, Ht = tr.height;
  var s2 = Math.max(Wt / 2000, 2.5 * Ht / 1050), iw2 = 2000 * s2, ih2 = 1050 * s2;
  var l2 = (Wt - iw2) / 2, t2 = Ht - ih2;
  var list = tiles.querySelectorAll(".tile");
  for (var k = 0; k < list.length; k++) {
    var r = list[k].getBoundingClientRect();
    list[k].style.backgroundSize = iw2 + "px " + ih2 + "px";
    list[k].style.backgroundPosition = (l2 - (r.left - tr.left)) + "px " + (t2 - (r.top - tr.top)) + "px";
  }
}
function renderAll() { renderFilters(); renderSections(); layoutMosaic(); }
window.addEventListener("resize", layoutMosaic);
window.addEventListener("load", layoutMosaic);
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMosaic); } catch (err) {}

function drawerHtml(e) {
  return '<div class="drawer-head t' + tIdx(e) + '"><span class="chips"><span class="chip">' + esc(dInd(e.sub)) + '</span><span class="chip lv lv' + e.lvlN + '">' + esc(e.lvl) + '</span><span class="chip">' + esc(e.written ? U("written") : U("oral")) + '</span><span class="chip tc">' + esc(dType(e.type)) + "</span></span>" +
    '<button type="button" class="close" id="close" aria-label="' + esc(U("close")) + '"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
    '<div class="drawer-body"><h1>' + esc(e.title) + "</h1>" +
    '<p class="scenario">' + esc(e.scenario) + "</p>" +
    '<dl class="facts"><dt>' + esc(U("avatar")) + "</dt><dd>" + esc(e.avatar) + "</dd><dt>" + esc(U("role")) + "</dt><dd>" + esc(e.role) + "</dd><dt>" + esc(U("goal")) + "</dt><dd>" + esc(e.goal) + "</dd><dt>" + esc(U("skill")) + "</dt><dd>" + esc(e.skill) + "</dd></dl>" +
    '<div class="dsec"><h2>' + esc(U("promptH")) + '</h2><p>' + esc(U("promptP")) + '</p><div class="prompt-box"><p class="prompt" id="prompt-text">' + htmlPrompt(e.prompt) + "</p></div></div>" +
    '<div class="dsec"><h2>' + esc(U("phrasesH")) + '</h2><p>' + esc(U("phrasesP")) + '</p><ol class="lines">' +
    e.phrases.map(function (s, k) { return "<li><b>" + esc(U("labels")[k]) + "</b>" + esc(s) + "</li>"; }).join("") + "</ol></div></div>" +
    '<div class="drawer-foot"><button type="button" class="copy" id="copy">' + esc(U("copy")) + "</button></div>";
}

function openCase(id) {
  var e = byId(id);
  if (!e) return;
  lastFocus = document.activeElement;
  state.open = id;
  $("drawer").innerHTML = drawerHtml(e);
  $("drawer").hidden = false;
  $("scrim").hidden = false;
  try { document.body.style.overflow = "hidden"; } catch (err) {}
  try { location.hash = "cas-" + id; } catch (err) {}
  var c = $("close"); if (c) c.focus();
}
function closeCase() {
  state.open = 0;
  $("drawer").hidden = true;
  $("scrim").hidden = true;
  try { document.body.style.overflow = ""; } catch (err) {}
  try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {}
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (err) {} }
}

function fallbackSelect(el) {
  try { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (err) {}
}

document.addEventListener("click", function (ev) {
  var t = ev.target.closest("button");
  if (ev.target === $("scrim")) { closeCase(); return; }
  if (!t) return;
  if (t.hasAttribute("data-lang")) { setLang(t.getAttribute("data-lang")); return; }
  if (t.hasAttribute("data-ind")) { state.ind = state.ind === t.getAttribute("data-ind") && t.classList.contains("rail-btn") ? "Tous" : t.getAttribute("data-ind"); renderAll(); return; }
  if (t.hasAttribute("data-type")) { state.type = state.type === t.getAttribute("data-type") ? "Tous" : t.getAttribute("data-type"); renderAll(); return; }
  if (t.hasAttribute("data-see")) { state.ind = t.getAttribute("data-see"); renderAll(); window.scrollTo(0, 0); return; }
  if (t.id === "rail-home") { state.ind = "Tous"; state.type = "Tous"; state.q = ""; $("q").value = ""; renderAll(); window.scrollTo(0, 0); return; }
  if (t.classList.contains("card")) { openCase(Number(t.getAttribute("data-id"))); return; }
  if (t.id === "close") { closeCase(); return; }
  if (t.id === "copy") {
    var ex = byId(state.open);
    var text = plainPrompt(ex.prompt);
    var label = U("copy");
    var done = function () { t.textContent = U("copied"); t.classList.add("done"); setTimeout(function () { t.textContent = label; t.classList.remove("done"); }, 1800); };
    var failed = function () { fallbackSelect($("prompt-text")); t.textContent = U("failed"); setTimeout(function () { t.textContent = label; }, 3000); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, failed); } else { failed(); }
  }
});

document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && state.open) closeCase(); });

$("q").addEventListener("input", function (e) { state.q = e.target.value; renderSections(); });
$("v-entreprise").addEventListener("input", function (e) {
  state.entreprise = e.target.value;
  try { localStorage.setItem("rp-cas-usage-vars", JSON.stringify({ entreprise: state.entreprise })); } catch (err) {}
  var p = $("prompt-text"); var ex = byId(state.open);
  if (p && ex) p.innerHTML = htmlPrompt(ex.prompt);
});

try {
  var saved = JSON.parse(localStorage.getItem("rp-cas-usage-vars") || "null");
  if (saved && saved.entreprise) { state.entreprise = saved.entreprise; $("v-entreprise").value = state.entreprise; }
} catch (err) {}

function applyLang() {
  document.documentElement.setAttribute("lang", lang);
  document.title = U("title");
  $("t-internal").textContent = U("internal");
  $("t-crumb").textContent = U("crumb");
  $("t-search-sr").textContent = U("search"); $("q").placeholder = U("search");
  $("t-comp-sr").textContent = U("comp"); $("v-entreprise").placeholder = U("comp");
  $("company-box").title = U("compTip");
  $("t-h1").textContent = U("h1"); $("t-hero").textContent = U("hero");
  $("tiles").setAttribute("aria-label", U("useCases"));
  $("pills").setAttribute("aria-label", U("sector"));
  $("drawer").setAttribute("aria-label", U("drawer"));
  var lb = document.querySelectorAll(".lang button");
  for (var i = 0; i < lb.length; i++) lb[i].setAttribute("aria-pressed", String(lb[i].getAttribute("data-lang") === lang));
}
function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem("rp-cas-usage-lang", lang); } catch (err) {}
  buildExamples(); applyLang(); renderAll();
  if (state.open) { var e = byId(state.open); if (e) { $("drawer").innerHTML = drawerHtml(e); var c = $("close"); if (c) c.focus(); } }
}

applyLang();
renderAll();

try {
  var m = /^#cas-(\d+)$/.exec(location.hash || "");
  if (m && byId(Number(m[1]))) openCase(Number(m[1]));
} catch (err) {}
</script>
